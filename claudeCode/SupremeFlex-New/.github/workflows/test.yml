name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP tests (Laravel / PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-php

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend-php/vendor
          key: php-${{ hashFiles('backend-php/composer.lock') }}
          restore-keys: php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          JWT_SECRET: test_jwt_secret_for_ci

  node:
    name: Node tests (Vitest / supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test_jwt_secret_for_ci
          NODE_ENV: test
